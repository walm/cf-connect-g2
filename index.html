<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Connect 2026 · G2</title>
    <style>
      :root {
        --bg: #0d0d0f;
        --panel: #17171a;
        --panel-2: #1f1f24;
        --line: #2a2a31;
        --text: #ececf1;
        --muted: #8f8f9c;
        --orange: #f6821f;
        --orange-2: #fbad41;
        --green: #9cff8a;
        --star: #ffd166;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      input, select { font: inherit; }
      #app { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand .logo { width: 34px; height: 24px; }
      .brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.01em; }
      .brand small { display: block; color: var(--muted); font-size: 12px; }
      .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
      .pill.on { color: var(--green); border-color: #2d4a2a; }

      .glass { position: relative; background: #050806; border: 1px solid #1e2a1e; border-radius: 14px; padding: 10px 12px; box-shadow: inset 0 0 40px rgba(60, 255, 90, 0.05), 0 0 24px rgba(60, 255, 90, 0.06); aspect-ratio: 2 / 1; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
      .glass pre { margin: 0; color: var(--green); font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; text-shadow: 0 0 6px rgba(156, 255, 138, 0.45); }
      .glass .hdr { opacity: 0.75; }
      .glass .ftr { opacity: 0.55; }
      .glass .bodywrap { display: flex; gap: 10px; flex: 1; min-height: 0; margin: 6px 0; }
      .glass .bodywrap pre { flex: 1; overflow: hidden; }
      .glass .photos { display: flex; flex-direction: column; gap: 6px; width: 56px; flex: none; }
      .glass .photos img { width: 56px; height: 56px; border-radius: 4px; filter: grayscale(1) sepia(1) hue-rotate(60deg) saturate(2.5) brightness(0.9); }
      .glass .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 2px 3px); }

      .dpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 18px; }
      .dpad button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; font-size: 13px; color: var(--text); }
      .dpad button:active { background: var(--panel-2); }
      .dpad small { display: block; color: var(--muted); font-size: 11px; }

      .controls { display: grid; gap: 8px; margin-bottom: 14px; }
      .search { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; }
      .search:focus { border-color: var(--orange); }
      .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .seg::-webkit-scrollbar { display: none; }
      .seg button { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--muted); }
      .seg button.on { background: var(--orange); border-color: var(--orange); color: #141414; font-weight: 600; }
      .selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .selects select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }

      .count { color: var(--muted); font-size: 12px; margin: 4px 2px 10px; }
      .daybar { position: sticky; top: 0; z-index: 2; background: linear-gradient(var(--bg) 70%, transparent); padding: 10px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--orange-2); }

      .card { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
      .card.live { border-color: #2f5a2a; }
      .card.past { opacity: 0.55; }
      .card .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
      .card .time small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
      .card .time .live { color: var(--green); font-size: 11px; font-weight: 700; }
      .card h3 { margin: 0 0 3px; font-size: 15px; line-height: 1.3; }
      .card .meta { color: var(--muted); font-size: 12px; }
      .card .meta b { color: var(--orange-2); font-weight: 600; }
      .card .spk { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .card .spk img, .card .spk .ph { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--panel-2); border: 1px solid var(--line); }
      .card .spk .ph { display: inline-grid; place-items: center; font-size: 11px; color: var(--muted); }
      .card .spk span { font-size: 12px; color: var(--muted); }
      .card .actions { display: flex; flex-direction: column; gap: 6px; align-items: end; }
      .star { font-size: 22px; line-height: 1; color: #4a4a55; padding: 2px 4px; }
      .star.on { color: var(--star); text-shadow: 0 0 10px rgba(255, 209, 102, 0.5); }
      .show { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; white-space: nowrap; }
      .show:active { color: var(--green); }
      .desc { grid-column: 1 / -1; color: var(--muted); font-size: 13px; display: none; white-space: pre-wrap; }
      .card.open .desc { display: block; }

      details.dev { margin-top: 20px; color: var(--muted); font-size: 12px; }
      details.dev summary { cursor: pointer; }
      details.dev .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
      details.dev select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
      .empty { color: var(--muted); text-align: center; padding: 30px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
